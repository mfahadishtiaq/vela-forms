<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ Printing &amp; Signs · What You Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#faf7f1;--ink:#1c1915;--muted:#5c554a;--rule:#d9d2c3;--accent:#2c4a35;--accent-soft:#e9efe8}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:"Inter",sans-serif;font-size:16px;min-height:100vh;display:flex;flex-direction:column}
  .ribbon{background:#8a2a2a;color:#fff;text-align:center;font-size:13px;font-weight:600;padding:8px 12px}
  .topbar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);z-index:5}
  .topbar-inner{max-width:800px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
  .brand{font-size:12px;letter-spacing:.3em;color:var(--muted);font-weight:500}
  .meta{font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:10px;white-space:nowrap}
  .meta b{color:var(--ink);font-weight:600}
  .pct{color:var(--accent);font-weight:700;font-size:14px}
  .pct:empty{display:none}
  .bar{height:3px;background:var(--rule)}
  .bar i{display:block;height:100%;background:var(--accent);width:0%}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 22px 130px}
  .step{max-width:640px;width:100%;display:none}
  .step.active{display:block}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1,h2{font-family:"Source Serif 4",serif;font-weight:600;letter-spacing:-.01em;font-size:clamp(27px,5.4vw,38px);line-height:1.22}
  h1{font-weight:700}
  .hint{margin-top:12px;color:var(--muted);font-size:16px;line-height:1.6}
  .hint .em{color:var(--accent);font-weight:600}
  .cover p{margin-top:18px;font-size:17.5px;color:var(--ink);line-height:1.75;max-width:54ch;font-family:"Source Serif 4",serif}
  input[type=text],textarea{
    width:100%;margin-top:30px;font:inherit;font-size:17px;padding:10px 2px;color:var(--ink);
    background:transparent;border:none;border-bottom:1.5px solid var(--ink);border-radius:0;
  }
  textarea{min-height:110px;resize:vertical;line-height:1.65;border:1.5px solid var(--rule);border-bottom-color:var(--ink);padding:14px;background:#fffdf8}
  input:focus,textarea:focus{outline:none;border-bottom-color:var(--accent);border-bottom-width:2px}
  textarea:focus{border-color:var(--accent);border-width:1.5px;border-bottom-width:2px}
  ::placeholder{color:#9a9385}
  .choices{margin-top:30px;display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:center;gap:14px;border:1px solid var(--rule);background:#fffdf8;padding:15px 16px;cursor:pointer;font-size:16.5px;font-weight:500}
  .choice:hover{border-color:var(--ink)}
  .choice.picked{border-color:var(--accent);background:var(--accent-soft)}
  .choice input{appearance:none;width:19px;height:19px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;flex-shrink:0;display:grid;place-content:center}
  .choice input[type=radio]{border-radius:50%}
  .choice input:checked{background:var(--accent);border-color:var(--accent)}
  .choice input:checked::after{content:"";width:7px;height:7px;background:#fff}
  .choice input[type=radio]:checked::after{border-radius:50%}
  .other-field,.follow{display:none;margin:-2px 0 4px;padding-left:49px}
  .other-field.show,.follow.show{display:block}
  .other-field label,.follow label{display:block;font-size:14px;font-weight:600;color:var(--muted)}
  .other-field input,.follow input{margin-top:2px}
  .hours-grid{margin-top:30px;display:flex;flex-direction:column;gap:10px}
  .hours-row{display:grid;grid-template-columns:104px 1fr 22px 1fr;gap:10px;align-items:center}
  .hours-row .day{font-weight:600;font-size:15px}
  .hours-row .to{color:var(--muted);font-size:13px;text-align:center}
  .hours-row select{font:inherit;font-size:15px;padding:10px 8px;border:1px solid var(--rule);background:#fffdf8;color:var(--ink);border-radius:0;width:100%}
  .hours-row select:focus{outline:none;border-color:var(--accent)}
  .hours-row select:disabled{opacity:.4}
  .price-rows{margin-top:26px;display:flex;flex-direction:column;gap:18px}
  .price-row label{display:block;font-size:14px;font-weight:600;color:var(--muted)}
  .price-row input{margin-top:2px}
  .price-note{margin-top:26px;color:var(--muted);font-size:15.5px;line-height:1.6}
  input.list-item{margin-top:16px}
  input.list-item:first-of-type{margin-top:30px}
  .sort-rows{margin-top:24px;display:flex;flex-direction:column}
  .srow{border-top:1px solid var(--rule);padding:15px 0}
  .srow:last-of-type{border-bottom:1px solid var(--rule)}
  .sfact{font-family:"Source Serif 4",serif;font-size:16.5px;line-height:1.45}
  .spills{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:#fffdf8;padding:9px 15px;cursor:pointer;font-size:14.5px;font-weight:600}
  .pill:hover{border-color:var(--ink)}
  .pill.picked{border-color:var(--accent);background:var(--accent-soft)}
  .pill input{appearance:none;width:15px;height:15px;border:1.5px solid var(--ink);border-radius:50%;background:#fff;cursor:pointer;flex-shrink:0;display:grid;place-content:center}
  .pill input:checked{background:var(--accent);border-color:var(--accent)}
  .pill input:checked::after{content:"";width:5px;height:5px;border-radius:50%;background:#fff}
  .sextra{margin-top:24px}
  .sextra label{display:block;font-size:14px;font-weight:600;color:var(--muted)}
  .sextra input{margin-top:2px}
  .send-note{margin-top:22px;font-size:14px;color:var(--muted);line-height:1.55;display:none}
  .send-note.show{display:block}
  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--rule)}
  .nav-inner{max-width:800px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;gap:12px}
  button{font:inherit;font-weight:600;font-size:16px;letter-spacing:.04em;padding:15px 34px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:0}
  button.primary{background:var(--ink);color:#fff}
  button.primary:hover{background:var(--accent);border-color:var(--accent)}
  button:disabled{opacity:.35;cursor:default}
  .interstitial .big-no{font-family:"Source Serif 4",serif;font-size:64px;font-weight:700;color:var(--accent);line-height:1;margin-bottom:22px}
  @media(max-width:560px){
    main{padding:32px 18px 140px}
    .brand-tail{display:none}
    .meta b{max-width:140px;overflow:hidden;text-overflow:ellipsis}
    .hours-row{grid-template-columns:88px 1fr 16px 1fr;gap:6px}
    .hours-row select{padding:9px 4px;font-size:13.5px}
    .hours-row .day{font-size:13.5px}
  }
</style>
</head>
<body>
<div id="ribbon" class="ribbon" style="display:none">TEMPLATE COPY. Generate a client version before sending. Answers will not be submitted.</div>
<div class="topbar">
  <div class="topbar-inner">
    <span class="brand">VELA<span class="brand-tail"> &nbsp;·&nbsp; WEBSITE STUDIO</span></span>
    <span class="meta"><b id="secname">Welcome</b><span class="pct" id="pct"></span></span>
  </div>
  <div class="bar"><i id="fill"></i></div>
</div>

<main id="main"></main>

<div class="nav">
  <div class="nav-inner">
    <button id="back" type="button">Back</button>
    <button id="next" class="primary" type="button">Start</button>
  </div>
</div>

<script>
/* ================= PER-CLIENT CONFIG =================
   To generate a client copy: set clientName and subject,
   pick the module ('service' | 'product' | 'none'),
   list question ids to skip (facts already confirmed),
   and prefill anything already known. Nothing else changes. */
var CONFIG = {
  clientName: 'AZ Printing and Signs',
  subject: 'AZ Printing and Signs services answers',
  module: 'none',
  skip: [],
  prefill: {},
  emailUser: 'm.fahad.ishtiaq',
  emailDomain: 'gmail.com'
};

/* ================= SECTIONS =================
   Round 2, 2026-08-20, final shape. Fahad's rulings: no prices (he gets those
   himself), confirm nothing, photos are his to collect, and services are the
   only real blocker on starting the site. The owner has said the shop "offers
   everything", so a plain what-do-you-offer list would come back all ticked and
   teach us nothing. q1 therefore SORTS each item into printed here or sent out,
   which is the fact the copy actually needs.
   Audit: 00-Followup-Audit-2026-08-20.md */
var SECTIONS = [
  {t:'What You Do', i:'Five questions about the work itself. Almost all of it is tapping.'}
];
var MODULES = {
  service: {t:'Service Details', i:'A few questions about how your service works.', after:1},
  product: {t:'Product Details', i:'A few questions about your product and where it is sold.', after:1}
};
var INDUSTRY = {t:'', i:'', q:[]};

/* ================= QUESTIONS =================
   k: text | area | radio | check | sort  ·  sort rows carry l, and the
   question carries opts (two labels) plus an optional extra text field. */
var QUESTIONS = [
  {id:'q1', s:0, t:'For each of these, do you print it here or send it out?', h:'You offer all of these. We just need to know which ones run on your own machines.', k:'sort',
   opts:['We print it here','We send it out'],
   extra:'Anything else you print that is not on this list',
   rows:[
    {l:'Business cards, letterheads and envelopes'},
    {l:'Flyers, brochures and posters'},
    {l:'Wedding and event invitations'},
    {l:'Banners and vinyl signs'},
    {l:'Lawn signs and real estate signs'},
    {l:'Storefront signage and menu boards'},
    {l:'Stickers and labels'},
    {l:'Vehicle decals and wraps'},
    {l:'Shirts, uniforms and apparel'},
    {l:'Mugs, pens and promotional items'}
  ]},

  {id:'q2', s:0, t:'What else does the shop do, besides printing?', h:'Tick everything you offer.', k:'check', o:[
    {l:'Graphic design, where you make the artwork for the customer'},
    {l:'Installing signs, wraps and window graphics', link:'Which ones do you install?'},
    {l:'Shipping parcels for customers, across the counter'},
    {l:'Shipping finished print orders out to customers'},
    {l:'Personal mail boxes for rent', link:'How many boxes, and for how long does someone rent one?'}
  ], other:true},

  {id:'q3', s:0, t:'Which weddings and events do you make cards and signs for?', h:'Tick the ones you want to be known for.', k:'check', o:[
    {l:'Shaadi, nikkah, mehndi and walima'},
    {l:'Anand Karaj and Sikh ceremonies'},
    {l:'Hindu ceremonies, including mandap and haldi signage'},
    {l:'Christian and civil weddings'},
    {l:'Engagements and anniversaries'},
    {l:'Birthdays, graduations and community events'}
  ], other:true},

  {id:'q4', s:0, t:'Do you deliver finished orders?', h:'Please select one.', k:'radio', o:[
    {l:'Yes, we deliver', link:'Which areas do you deliver to?'},
    {l:'Yes, but only on bigger orders', link:'Which areas do you deliver to?'},
    {l:'No, everything is picked up from the shop'}
  ]},

  {id:'q5', s:0, t:'Do you give a better price on big orders?', h:'Please select one.', k:'radio', o:[
    {l:'Yes', link:'From roughly what quantity?'},
    {l:'It depends on the job', link:'What does it depend on?'},
    {l:'No, the price is the price'}
  ]}
];

/* ================= BUILD ================= */
var isTemplate = CONFIG.clientName.indexOf('[') !== -1;
if (isTemplate) document.getElementById('ribbon').style.display = 'block';

var mod = MODULES[CONFIG.module];
var active = QUESTIONS.concat(INDUSTRY.q).filter(function(q){
  if (CONFIG.skip.indexOf(q.id) !== -1) return false;
  if (q.mod && q.mod !== CONFIG.module) return false;
  return true;
});

/* section order: business-type module, then industry module, after SECTIONS[1] */
var secOrder = [];
SECTIONS.forEach(function(s, k){
  secOrder.push({key:k, t:s.t, i:s.i});
  if (mod && mod.after === k) secOrder.push({key:'m', t:mod.t, i:mod.i});
  if (k === 1 && INDUSTRY.q.length) secOrder.push({key:'i', t:INDUSTRY.t, i:INDUSTRY.i});
});
secOrder = secOrder.filter(function(s){ return active.some(function(q){ return q.s === s.key; }); });

var main = document.getElementById('main');
var total = active.length, qNo = 0;
var storeKey = 'vela-questionnaire-' + CONFIG.clientName;

function el(html){ var d = document.createElement('section'); d.className = 'step'; d.innerHTML = html; return d; }

/* cover */
main.appendChild(el(
  '<div class="cover"><div class="kicker">AZ Printing &amp; Signs</div>' +
  '<h1>One thing left before we build.</h1>' +
  '<p>Your website is written. Nothing here asks about prices, and nothing asks what you have already told us. We just need the list of what the shop does, so that nothing you offer gets left off the site.</p>' +
  '<p>Five questions, and nearly all of it is tapping. Two minutes.</p></div>'
));

secOrder.forEach(function(sec, si){
  var inter = el('<div class="interstitial"><div class="big-no">' + String(si + 1).padStart(2, '0') + '</div><h2></h2><p class="hint"></p></div>');
  inter.querySelector('h2').textContent = sec.t;
  inter.querySelector('.hint').textContent = sec.i;
  main.appendChild(inter);

  active.filter(function(q){ return q.s === sec.key; }).forEach(function(q){
    qNo++;
    var s = el('<div class="kicker">Question ' + qNo + ' of ' + total + '</div><h2></h2>' + (q.h ? '<p class="hint"></p>' : ''));
    s.dataset.sec = sec.t; s.dataset.qid = q.id; s.dataset.qno = qNo;
    s.querySelector('h2').textContent = q.t;
    if (q.h){ var hn = s.querySelector('.hint'); if (q.hHtml) hn.innerHTML = q.h; else hn.textContent = q.h; }

    if (q.k === 'text' || q.k === 'area'){
      var f = document.createElement(q.k === 'text' ? 'input' : 'textarea');
      if (q.k === 'text') f.type = 'text';
      f.placeholder = 'Your answer'; f.dataset.ans = q.id;
      if (CONFIG.prefill[q.id]) f.value = CONFIG.prefill[q.id];
      s.appendChild(f);
    } else if (q.k === 'hours'){
      /* Monday to Sunday rows with adjustable open/close times (Fahad, 2026-08-12) */
      var days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
      var times = [];
      for (var hh = 6; hh <= 22; hh++){
        var h12 = ((hh + 11) % 12) + 1, ap = hh < 12 ? 'AM' : 'PM';
        times.push(h12 + ':00 ' + ap);
        if (hh < 22) times.push(h12 + ':30 ' + ap);
      }
      var grid = document.createElement('div'); grid.className = 'hours-grid';
      days.forEach(function(day){
        var row = document.createElement('div'); row.className = 'hours-row';
        var dl = document.createElement('span'); dl.className = 'day'; dl.textContent = day;
        var so = document.createElement('select'); so.dataset.ansHours = q.id + '||' + day + '||open';
        ['Closed'].concat(times).forEach(function(tv){ var o1 = document.createElement('option'); o1.value = tv; o1.textContent = tv; so.appendChild(o1); });
        var to = document.createElement('span'); to.className = 'to'; to.textContent = 'to';
        var sc = document.createElement('select'); sc.dataset.ansHours = q.id + '||' + day + '||close';
        times.forEach(function(tv){ var o2 = document.createElement('option'); o2.value = tv; o2.textContent = tv; sc.appendChild(o2); });
        /* all days preset open so it is clear every time can be changed (Fahad, 2026-08-12) */
        so.value = '9:00 AM'; sc.value = '5:00 PM';
        row.appendChild(dl); row.appendChild(so); row.appendChild(to); row.appendChild(sc);
        grid.appendChild(row);
      });
      s.appendChild(grid);
    } else if (q.k === 'prices'){
      /* one price field per service from q5, built when the step opens (Fahad, 2026-08-12) */
      var pw = document.createElement('div'); pw.className = 'price-rows'; pw.dataset.source = 'q5'; pw.dataset.priceId = q.id;
      s.appendChild(pw);
    } else if (q.k === 'sort'){
      /* two-way sort: the owner says the shop offers everything, so the useful
         answer is printed here vs sent out, one tap per row (2026-08-20) */
      var sw = document.createElement('div'); sw.className = 'sort-rows';
      q.rows.forEach(function(row, ri){
        var rw = document.createElement('div'); rw.className = 'srow';
        var rl = document.createElement('p'); rl.className = 'sfact'; rl.textContent = row.l;
        var pw2 = document.createElement('div'); pw2.className = 'spills';
        q.opts.forEach(function(val){
          var pl = document.createElement('label'); pl.className = 'pill';
          var pi = document.createElement('input'); pi.type = 'radio';
          pi.name = q.id + '-r' + ri; pi.value = val;
          pi.dataset.ansSort = q.id + '||' + row.l;
          pl.appendChild(pi); pl.appendChild(document.createTextNode(val));
          pw2.appendChild(pl);
        });
        rw.appendChild(rl); rw.appendChild(pw2);
        sw.appendChild(rw);
      });
      s.appendChild(sw);
      if (q.extra){
        var xw = document.createElement('div'); xw.className = 'sextra';
        var xl = document.createElement('label'); xl.textContent = q.extra;
        var xi = document.createElement('input'); xi.type = 'text'; xi.placeholder = 'Your answer';
        xi.dataset.ansExtra = q.id;
        xw.appendChild(xl); xw.appendChild(xi);
        s.appendChild(xw);
      }
    } else if (q.k === 'list5'){
      for (var n = 1; n <= 5; n++){
        var li = document.createElement('input'); li.type = 'text';
        li.placeholder = 'Question ' + n; li.dataset.ansMulti = q.id + '||' + n;
        li.className = 'list-item';
        s.appendChild(li);
      }
    } else {
      var wrap = document.createElement('div'); wrap.className = 'choices';
      var inputType = q.k === 'radio' ? 'radio' : 'checkbox';
      q.o.forEach(function(opt, oi){
        var lab = document.createElement('label'); lab.className = 'choice';
        var inp = document.createElement('input'); inp.type = inputType; inp.name = q.id; inp.value = opt.l;
        if (opt.link) inp.dataset.follow = q.id + '-f' + oi;
        lab.appendChild(inp); lab.appendChild(document.createTextNode(opt.l));
        wrap.appendChild(lab);
        /* reveal field opens directly beneath its own option (Fahad, 2026-08-12) */
        if (opt.link){
          var fw = document.createElement('div'); fw.className = 'follow'; fw.id = q.id + '-f' + oi;
          var fl = document.createElement('label'); fl.textContent = opt.link;
          var fi = document.createElement('input'); fi.type = 'text'; fi.placeholder = 'Your answer';
          fi.dataset.ansLink = q.id + '||' + opt.l;
          fw.appendChild(fl); fw.appendChild(fi); wrap.appendChild(fw);
        }
      });
      if (q.other){
        var lab2 = document.createElement('label'); lab2.className = 'choice';
        var inp2 = document.createElement('input'); inp2.type = inputType; inp2.name = q.id; inp2.value = 'Other';
        inp2.className = 'other-toggle';
        lab2.appendChild(inp2); lab2.appendChild(document.createTextNode('Other'));
        wrap.appendChild(lab2);
        var ow = document.createElement('div'); ow.className = 'other-field';
        ow.innerHTML = '<label>If other, please describe</label><input type="text" placeholder="Your answer">';
        ow.querySelector('input').dataset.ansOther = q.id;
        wrap.appendChild(ow);
      }
      s.appendChild(wrap);
    }
    main.appendChild(s);
  });
});

/* final step */
main.appendChild(el(
  '<div class="interstitial"><div class="big-no">✓</div>' +
  '<h2>Thank you. That was the final question.</h2>' +
  '<p class="hint">Please press Send and your answers will go directly to Fahad. Nothing is published without your approval.</p>' +
  '<p class="send-note" id="sendnote"></p></div>'
));

/* ================= STEPPER ================= */
var steps = [].slice.call(document.querySelectorAll('.step')), i = 0;
var back = document.getElementById('back'), next = document.getElementById('next'),
    fill = document.getElementById('fill'), secname = document.getElementById('secname'), pct = document.getElementById('pct');

function buildPrices(step){
  var pw = step.querySelector('.price-rows'); if (!pw) return;
  var src = document.querySelector('[data-ans="' + pw.dataset.source + '"]');
  var items = src && src.value ? src.value.split('\n').map(function(x){ return x.replace(/^\s*(?:[-•*]|\d+[.)])\s*/, '').trim(); }).filter(Boolean) : [];
  var prev = {};
  [].slice.call(pw.querySelectorAll('input[data-ans-price]')).forEach(function(inp){ prev[inp.dataset.ansPrice] = inp.value; });
  pw.innerHTML = '';
  if (!items.length){
    var note = document.createElement('p'); note.className = 'price-note';
    note.textContent = 'Once you list your services in the previous question, each one will appear here with its own price field. You can press Back to add them.';
    pw.appendChild(note); return;
  }
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch(e){}
  items.forEach(function(name){
    var row = document.createElement('div'); row.className = 'price-row';
    var lb = document.createElement('label'); lb.textContent = name;
    var inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'For example $150, or from $100';
    inp.dataset.ansPrice = pw.dataset.priceId + '||' + name;
    inp.value = prev[inp.dataset.ansPrice] || saved['P:' + inp.dataset.ansPrice] || '';
    row.appendChild(lb); row.appendChild(inp); pw.appendChild(row);
  });
}
function render(){
  steps.forEach(function(s, k){ s.classList.toggle('active', k === i); });
  buildPrices(steps[i]);
  back.disabled = i === 0;
  next.textContent = i === 0 ? 'Start' : (i === steps.length - 1 ? 'Send Your Answers' : 'Next');
  var p = Math.round(i / (steps.length - 1) * 100);
  fill.style.width = p + '%';
  pct.textContent = i === 0 ? '' : (p + '%');
  secname.textContent = steps[i].dataset.sec || (i === 0 ? 'Welcome' : (i === steps.length - 1 ? 'Done' : 'Section'));
  try { localStorage.setItem(storeKey + '-step', i); } catch(e){}
}
next.onclick = function(){ if (i === steps.length - 1) { submit(); return; } i++; render(); };
back.onclick = function(){ if (i > 0){ i--; render(); } };

document.addEventListener('change', function(e){
  if (e.target.dataset && e.target.dataset.ansHours && e.target.dataset.ansHours.slice(-6) === '||open'){
    var closeSel = e.target.closest('.hours-row').querySelector('select[data-ans-hours$="close"]');
    if (closeSel) closeSel.disabled = e.target.value === 'Closed';
  }
  var p2 = e.target.closest('.pill');
  if (p2){
    p2.parentElement.querySelectorAll('.pill').forEach(function(x){ x.classList.remove('picked'); });
    p2.classList.add('picked');
  }
  var c = e.target.closest('.choice');
  if (c){
    if (e.target.type === 'radio') c.parentElement.querySelectorAll('.choice').forEach(function(x){ x.classList.remove('picked'); });
    c.classList.toggle('picked', e.target.checked);
    /* sync every follow field in this question's group, so switching a radio
       away from Yes hides the field it opened */
    [].slice.call(c.parentElement.querySelectorAll('input[data-follow]')).forEach(function(inp){
      var fw = document.getElementById(inp.dataset.follow);
      if (fw) fw.classList.toggle('show', inp.checked);
    });
    if (e.target.dataset.follow && e.target.checked){
      var fw2 = document.getElementById(e.target.dataset.follow);
      if (fw2) fw2.querySelector('input').focus();
    }
    if (e.target.classList.contains('other-toggle')){
      var of = e.target.closest('.step').querySelector('.other-field');
      if (of){ of.classList.toggle('show', e.target.checked); if (e.target.checked) of.querySelector('input').focus(); }
    }
  }
  save();
});
document.addEventListener('input', save);

/* ================= SAVE / RESTORE ================= */
function collect(){
  var out = {};
  steps.forEach(function(s){
    var qid = s.dataset.qid; if (!qid) return;
    var q = active.filter(function(x){ return x.id === qid; })[0];
    var key = 'Q' + s.dataset.qno + '. ' + q.t;
    var parts = [];
    var free = s.querySelector('[data-ans]');
    if (free && free.value.trim()) parts.push(free.value.trim());
    [].slice.call(s.querySelectorAll('[data-ans-multi]')).forEach(function(inp){
      if (inp.value.trim()) parts.push(inp.dataset.ansMulti.split('||')[1] + ') ' + inp.value.trim());
    });
    [].slice.call(s.querySelectorAll('[data-ans-price]')).forEach(function(inp){
      if (inp.value.trim()) parts.push(inp.dataset.ansPrice.split('||')[1] + ': ' + inp.value.trim());
    });
    var hsels = [].slice.call(s.querySelectorAll('select[data-ans-hours]'));
    if (hsels.length){
      var byDay = {};
      hsels.forEach(function(sel){ var p = sel.dataset.ansHours.split('||'); byDay[p[1]] = byDay[p[1]] || {}; byDay[p[1]][p[2]] = sel.value; });
      ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(function(d){
        if (!byDay[d]) return;
        parts.push(d + ': ' + (byDay[d].open === 'Closed' ? 'Closed' : byDay[d].open + ' to ' + byDay[d].close));
      });
    }
    [].slice.call(s.querySelectorAll('input[data-ans-sort]:checked')).forEach(function(inp){
      parts.push(inp.dataset.ansSort.split('||')[1] + ': ' + inp.value);
    });
    var xtra = s.querySelector('[data-ans-extra]');
    if (xtra && xtra.value.trim()) parts.push('Also printed here: ' + xtra.value.trim());
    var follows = {};
    [].slice.call(s.querySelectorAll('[data-ans-link]')).forEach(function(inp){
      if (inp.value.trim()) follows[inp.dataset.ansLink.split('||')[1]] = inp.value.trim();
    });
    [].slice.call(s.querySelectorAll('.choice input:checked')).forEach(function(inp){
      if (inp.value === 'Other'){
        var o = s.querySelector('[data-ans-other]');
        parts.push('Other' + (o && o.value.trim() ? ' (' + o.value.trim() + ')' : ''));
      } else parts.push(follows[inp.value] ? inp.value + ': ' + follows[inp.value] : inp.value);
    });
    out[key] = parts.length ? parts.join(' ; ') : '(skipped)';
  });
  return out;
}
function fieldKey(f){
  if (f.dataset.ansSort) return 'S:' + f.dataset.ansSort + '::' + f.value;
  if (f.dataset.ansExtra) return 'X:' + f.dataset.ansExtra;
  if (f.dataset.ans) return 'a:' + f.dataset.ans;
  if (f.dataset.ansLink) return 'l:' + f.dataset.ansLink;
  if (f.dataset.ansMulti) return 'm:' + f.dataset.ansMulti;
  if (f.dataset.ansOther) return 'o:' + f.dataset.ansOther;
  if (f.dataset.ansPrice) return 'P:' + f.dataset.ansPrice;
  if (f.dataset.ansHours) return 'H:' + f.dataset.ansHours;
  if (f.name) return 'c:' + f.name + '::' + f.value;
  return null;
}
function save(){
  try {
    var vals = {};
    [].slice.call(document.querySelectorAll('input[type=text],textarea,select')).forEach(function(f){
      var k = fieldKey(f); if (k && f.value) vals[k] = f.value;
    });
    [].slice.call(document.querySelectorAll('.choice input, .pill input')).forEach(function(f){
      var k = fieldKey(f); if (k && f.checked) vals[k] = 1;
    });
    localStorage.setItem(storeKey, JSON.stringify(vals));
  } catch(e){}
}
function restore(){
  try {
    var vals = JSON.parse(localStorage.getItem(storeKey) || '{}');
    [].slice.call(document.querySelectorAll('input[type=text],textarea,select')).forEach(function(f){
      var k = fieldKey(f); if (k && vals[k]) f.value = vals[k];
    });
    [].slice.call(document.querySelectorAll('select[data-ans-hours$="open"]')).forEach(function(so){
      var cs = so.closest('.hours-row').querySelector('select[data-ans-hours$="close"]');
      if (cs) cs.disabled = so.value === 'Closed';
    });
    [].slice.call(document.querySelectorAll('.choice input, .pill input')).forEach(function(f){
      var k = fieldKey(f);
      if (k && vals[k]){ f.checked = true; f.dispatchEvent(new Event('change', {bubbles:true})); }
    });
    var st = parseInt(localStorage.getItem(storeKey + '-step') || '0', 10);
    if (st > 0 && st < steps.length - 1) i = st;
  } catch(e){}
}

/* ================= SUBMIT ================= */
var submitArmed = false;
function submit(){
  var note = document.getElementById('sendnote');
  if (isTemplate){
    note.textContent = 'This is the studio template, so sending is turned off.';
    note.classList.add('show');
    return;
  }
  var payload = collect();
  var answered = Object.keys(payload).filter(function(k){ return k.charAt(0) === 'Q' && payload[k] !== '(skipped)'; }).length;
  if (answered < 5 && !submitArmed){
    submitArmed = true;
    note.textContent = 'You have answered ' + answered + ' of ' + total + ' questions. If that is what you intended, please press Send Your Answers again.';
    note.classList.add('show');
    return;
  }
  next.disabled = true; next.textContent = 'Sending…';
  payload._subject = CONFIG.subject;
  payload._template = 'box';
  payload._captcha = 'false';
  var endpoint = 'https://formsubmit.co/ajax/' + CONFIG.emailUser + '@' + CONFIG.emailDomain;
  fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
    body: JSON.stringify(payload)
  }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(){
    document.querySelector('.step.active h2').textContent = 'Your answers have been sent. Thank you.';
    document.querySelector('.step.active .hint').textContent = 'Fahad has received your answers and will be in touch. Nothing is published without your approval.';
    next.style.display = 'none'; back.style.display = 'none';
    try { localStorage.removeItem(storeKey); localStorage.removeItem(storeKey + '-step'); } catch(e){}
  })
  .catch(function(){
    next.disabled = false; next.textContent = 'Send Your Answers';
    note.textContent = 'The send did not go through. Please check your internet connection and press Send Your Answers again.';
    note.classList.add('show');
  });
}

restore();
render();
</script>
