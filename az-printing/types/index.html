/* ================= BUILD ================= */
var isTemplate = CONFIG.clientName.indexOf('[') !== -1;
if (isTemplate) document.getElementById('ribbon').style.display = 'block';

var mod = MODULES[CONFIG.module];
var active = QUESTIONS.concat(INDUSTRY.q).filter(function(q){
  if (CONFIG.skip.indexOf(q.id) !== -1) return false;
  if (q.mod && q.mod !== CONFIG.module) return false;
  return true;
});

/* section order: business-type module, then industry module, after SECTIONS[1] */
var secOrder = [];
SECTIONS.forEach(function(s, k){
  secOrder.push({key:k, t:s.t, i:s.i});
  if (mod && mod.after === k) secOrder.push({key:'m', t:mod.t, i:mod.i});
  if (k === 1 && INDUSTRY.q.length) secOrder.push({key:'i', t:INDUSTRY.t, i:INDUSTRY.i});
});
secOrder = secOrder.filter(function(s){ return active.some(function(q){ return q.s === s.key; }); });

var main = document.getElementById('main');
var total = active.length, qNo = 0;
var storeKey = 'vela-questionnaire-' + CONFIG.clientName + '-r3-types';

function el(html){ var d = document.createElement('section'); d.className = 'step'; d.innerHTML = html; return d; }

/* cover */
main.appendChild(el(
  '<div class="cover"><div class="kicker">AZ Printing &amp; Signs</div>' +
  '<h1>Which types of each product do you offer?</h1>' +
  '<p>On your website, each of your fourteen products opens a list of its types: the finishes of a business card, the sizes of a flyer, the kinds of signs. Please tap Yes or No against each one, so that your website lists exactly what you offer and nothing you do not.</p>' +
  '<p>Anything you have already confirmed is marked Yes; change it if it is wrong. Under each product there is a space for any type we have missed. Nothing here asks about prices. About five minutes, and your answers save as you go.</p></div>'
));

secOrder.forEach(function(sec, si){
  var inter = el('<div class="interstitial"><div class="big-no">' + String(si + 1).padStart(2, '0') + '</div><h2></h2><p class="hint"></p></div>');
  inter.querySelector('h2').textContent = sec.t;
  inter.querySelector('.hint').textContent = sec.i;
  main.appendChild(inter);

  active.filter(function(q){ return q.s === sec.key; }).forEach(function(q){
    qNo++;
    var s = el('<div class="kicker">Question ' + qNo + ' of ' + total + '</div><h2></h2>' + (q.h ? '<p class="hint"></p>' : ''));
    s.dataset.sec = sec.t; s.dataset.qid = q.id; s.dataset.qno = qNo;
    s.querySelector('h2').textContent = q.t;
    if (q.h){ var hn = s.querySelector('.hint'); if (q.hHtml) hn.innerHTML = q.h; else hn.textContent = q.h; }

    if (q.k === 'text' || q.k === 'area'){
      var f = document.createElement(q.k === 'text' ? 'input' : 'textarea');
      if (q.k === 'text') f.type = 'text';
      f.placeholder = 'Your answer'; f.dataset.ans = q.id;
      if (CONFIG.prefill[q.id]) f.value = CONFIG.prefill[q.id];
      s.appendChild(f);
    } else if (q.k === 'hours'){
      /* Monday to Sunday rows with adjustable open/close times (Fahad, 2026-08-12) */
      var days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
      var times = [];
      for (var hh = 6; hh <= 22; hh++){
        var h12 = ((hh + 11) % 12) + 1, ap = hh < 12 ? 'AM' : 'PM';
        times.push(h12 + ':00 ' + ap);
        if (hh < 22) times.push(h12 + ':30 ' + ap);
      }
      var grid = document.createElement('div'); grid.className = 'hours-grid';
      days.forEach(function(day){
        var row = document.createElement('div'); row.className = 'hours-row';
        var dl = document.createElement('span'); dl.className = 'day'; dl.textContent = day;
        var so = document.createElement('select'); so.dataset.ansHours = q.id + '||' + day + '||open';
        ['Closed'].concat(times).forEach(function(tv){ var o1 = document.createElement('option'); o1.value = tv; o1.textContent = tv; so.appendChild(o1); });
        var to = document.createElement('span'); to.className = 'to'; to.textContent = 'to';
        var sc = document.createElement('select'); sc.dataset.ansHours = q.id + '||' + day + '||close';
        times.forEach(function(tv){ var o2 = document.createElement('option'); o2.value = tv; o2.textContent = tv; sc.appendChild(o2); });
        /* all days preset open so it is clear every time can be changed (Fahad, 2026-08-12) */
        so.value = '9:00 AM'; sc.value = '5:00 PM';
        row.appendChild(dl); row.appendChild(so); row.appendChild(to); row.appendChild(sc);
        grid.appendChild(row);
      });
      s.appendChild(grid);
    } else if (q.k === 'prices'){
      /* one price field per service from q5, built when the step opens (Fahad, 2026-08-12) */
      var pw = document.createElement('div'); pw.className = 'price-rows'; pw.dataset.source = 'q5'; pw.dataset.priceId = q.id;
      s.appendChild(pw);
    } else if (q.k === 'grid'){
      /* full service menu, Yes or No against each line (Fahad, 2026-08-20) */
      var gw = document.createElement('div'); gw.className = 'grid-rows';
      q.rows.forEach(function(row, ri){
        if (row.set){ var st = document.createElement('p'); st.className = 'gset'; st.textContent = row.set; gw.appendChild(st); return; }
        var rw = document.createElement('div'); rw.className = 'grow';
        var rl = document.createElement('p'); rl.className = 'gfact'; rl.textContent = row.l;
        if (row.d){ var rd = document.createElement('span'); rd.className = 'gsub'; rd.textContent = row.d; rl.appendChild(rd); }
        var pw2 = document.createElement('div'); pw2.className = 'gpills';
        q.opts.forEach(function(val){
          var pl = document.createElement('label'); pl.className = 'pill';
          var pi = document.createElement('input'); pi.type = 'radio';
          pi.name = q.id + '-r' + ri; pi.value = val;
          pi.dataset.ansGrid = q.id + '||' + row.l;
          if (row.y && val === 'Yes'){ pi.checked = true; pl.classList.add('picked'); }
          pl.appendChild(pi); pl.appendChild(document.createTextNode(val));
          pw2.appendChild(pl);
        });
        rw.appendChild(rl); rw.appendChild(pw2);
        gw.appendChild(rw);
      });
      s.appendChild(gw);
      if (q.extra){
        var xw = document.createElement('div'); xw.className = 'gextra';
        var xl = document.createElement('label'); xl.textContent = q.extra;
        var xi = document.createElement('input'); xi.type = 'text'; xi.placeholder = 'Your answer';
        xi.dataset.ansExtra = q.id;
        xw.appendChild(xl); xw.appendChild(xi);
        s.appendChild(xw);
      }
    } else if (q.k === 'list5'){
      for (var n = 1; n <= 5; n++){
        var li = document.createElement('input'); li.type = 'text';
        li.placeholder = 'Question ' + n; li.dataset.ansMulti = q.id + '||' + n;
        li.className = 'list-item';
        s.appendChild(li);
      }
    } else {
      var wrap = document.createElement('div'); wrap.className = 'choices';
      var inputType = q.k === 'radio' ? 'radio' : 'checkbox';
      q.o.forEach(function(opt, oi){
        var lab = document.createElement('label'); lab.className = 'choice';
        var inp = document.createElement('input'); inp.type = inputType; inp.name = q.id; inp.value = opt.l;
        if (opt.link) inp.dataset.follow = q.id + '-f' + oi;
        lab.appendChild(inp); lab.appendChild(document.createTextNode(opt.l));
        wrap.appendChild(lab);
        /* reveal field opens directly beneath its own option (Fahad, 2026-08-12) */
        if (opt.link){
          var fw = document.createElement('div'); fw.className = 'follow'; fw.id = q.id + '-f' + oi;
          var fl = document.createElement('label'); fl.textContent = opt.link;
          var fi = document.createElement('input'); fi.type = 'text'; fi.placeholder = 'Your answer';
          fi.dataset.ansLink = q.id + '||' + opt.l;
          fw.appendChild(fl); fw.appendChild(fi); wrap.appendChild(fw);
        }
      });
      if (q.other){
        var lab2 = document.createElement('label'); lab2.className = 'choice';
        var inp2 = document.createElement('input'); inp2.type = inputType; inp2.name = q.id; inp2.value = 'Other';
        inp2.className = 'other-toggle';
        lab2.appendChild(inp2); lab2.appendChild(document.createTextNode('Other'));
        wrap.appendChild(lab2);
        var ow = document.createElement('div'); ow.className = 'other-field';
        ow.innerHTML = '<label>If other, please describe</label><input type="text" placeholder="Your answer">';
        ow.querySelector('input').dataset.ansOther = q.id;
        wrap.appendChild(ow);
      }
      s.appendChild(wrap);
    }
    main.appendChild(s);
  });
});

/* ================= STEPPER ================= */
var steps = [].slice.call(document.querySelectorAll('.step')), i = 0;
var back = document.getElementById('back'), next = document.getElementById('next'),
    fill = document.getElementById('fill'), secname = document.getElementById('secname'), pct = document.getElementById('pct');

function buildPrices(step){
  var pw = step.querySelector('.price-rows'); if (!pw) return;
  var src = document.querySelector('[data-ans="' + pw.dataset.source + '"]');
  var items = src && src.value ? src.value.split('\n').map(function(x){ return x.replace(/^\s*(?:[-•*]|\d+[.)])\s*/, '').trim(); }).filter(Boolean) : [];
  var prev = {};
  [].slice.call(pw.querySelectorAll('input[data-ans-price]')).forEach(function(inp){ prev[inp.dataset.ansPrice] = inp.value; });
  pw.innerHTML = '';
  if (!items.length){
    var note = document.createElement('p'); note.className = 'price-note';
    note.textContent = 'Once you list your services in the previous question, each one will appear here with its own price field. You can press Back to add them.';
    pw.appendChild(note); return;
  }
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch(e){}
  items.forEach(function(name){
    var row = document.createElement('div'); row.className = 'price-row';
    var lb = document.createElement('label'); lb.textContent = name;
    var inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'For example $150, or from $100';
    inp.dataset.ansPrice = pw.dataset.priceId + '||' + name;
    inp.value = prev[inp.dataset.ansPrice] || saved['P:' + inp.dataset.ansPrice] || '';
    row.appendChild(lb); row.appendChild(inp); pw.appendChild(row);
  });
}
function render(){
  steps.forEach(function(s, k){ s.classList.toggle('active', k === i); });
  buildPrices(steps[i]);
  back.disabled = i === 0;
  next.textContent = i === 0 ? 'Start' : (i === steps.length - 1 ? 'Send Your Answers' : 'Next');
  var p = Math.round(i / (steps.length - 1) * 100);
  fill.style.width = p + '%';
  pct.textContent = i === 0 ? '' : (p + '%');
  secname.textContent = steps[i].dataset.sec || (i === 0 ? 'Welcome' : (i === steps.length - 1 ? 'Done' : 'Section'));
  try { localStorage.setItem(storeKey + '-step', i); } catch(e){}
}
next.onclick = function(){ if (i === steps.length - 1) { submit(); return; } i++; render(); };
back.onclick = function(){ if (i > 0){ i--; render(); } };

document.addEventListener('change', function(e){
  if (e.target.dataset && e.target.dataset.ansHours && e.target.dataset.ansHours.slice(-6) === '||open'){
    var closeSel = e.target.closest('.hours-row').querySelector('select[data-ans-hours$="close"]');
    if (closeSel) closeSel.disabled = e.target.value === 'Closed';
  }
  var p2 = e.target.closest('.pill');
  if (p2){
    p2.parentElement.querySelectorAll('.pill').forEach(function(x){ x.classList.remove('picked'); });
    p2.classList.add('picked');
  }
  var c = e.target.closest('.choice');
  if (c){
    if (e.target.type === 'radio') c.parentElement.querySelectorAll('.choice').forEach(function(x){ x.classList.remove('picked'); });
    c.classList.toggle('picked', e.target.checked);
    /* sync every follow field in this question's group, so switching a radio
       away from Yes hides the field it opened */
    [].slice.call(c.parentElement.querySelectorAll('input[data-follow]')).forEach(function(inp){
      var fw = document.getElementById(inp.dataset.follow);
      if (fw) fw.classList.toggle('show', inp.checked);
    });
    if (e.target.dataset.follow && e.target.checked){
      var fw2 = document.getElementById(e.target.dataset.follow);
      if (fw2) fw2.querySelector('input').focus();
    }
    if (e.target.classList.contains('other-toggle')){
      var of = e.target.closest('.step').querySelector('.other-field');
      if (of){ of.classList.toggle('show', e.target.checked); if (e.target.checked) of.querySelector('input').focus(); }
    }
  }
  save();
});
document.addEventListener('input', save);

/* ================= SAVE / RESTORE ================= */
function collect(){
  var out = {};
  steps.forEach(function(s){
    var qid = s.dataset.qid; if (!qid) return;
    var q = active.filter(function(x){ return x.id === qid; })[0];
    var key = 'Q' + s.dataset.qno + '. ' + q.t;
    var parts = [];
    var free = s.querySelector('[data-ans]');
    if (free && free.value.trim()) parts.push(free.value.trim());
    [].slice.call(s.querySelectorAll('[data-ans-multi]')).forEach(function(inp){
      if (inp.value.trim()) parts.push(inp.dataset.ansMulti.split('||')[1] + ') ' + inp.value.trim());
    });
    [].slice.call(s.querySelectorAll('[data-ans-price]')).forEach(function(inp){
      if (inp.value.trim()) parts.push(inp.dataset.ansPrice.split('||')[1] + ': ' + inp.value.trim());
    });
    var hsels = [].slice.call(s.querySelectorAll('select[data-ans-hours]'));
    if (hsels.length){
      var byDay = {};
      hsels.forEach(function(sel){ var p = sel.dataset.ansHours.split('||'); byDay[p[1]] = byDay[p[1]] || {}; byDay[p[1]][p[2]] = sel.value; });
      ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(function(d){
        if (!byDay[d]) return;
        parts.push(d + ': ' + (byDay[d].open === 'Closed' ? 'Closed' : byDay[d].open + ' to ' + byDay[d].close));
      });
    }
    var yes = [], no = [];
    [].slice.call(s.querySelectorAll('input[data-ans-grid]:checked')).forEach(function(inp){
      (inp.value === 'Yes' ? yes : no).push(inp.dataset.ansGrid.split('||')[1]);
    });
    if (yes.length) parts.push('YES: ' + yes.join(', '));
    if (no.length) parts.push('NO: ' + no.join(', '));
    var xtra = s.querySelector('[data-ans-extra]');
    if (xtra && xtra.value.trim()) parts.push('ALSO: ' + xtra.value.trim());
    var follows = {};
    [].slice.call(s.querySelectorAll('[data-ans-link]')).forEach(function(inp){
      if (inp.value.trim()) follows[inp.dataset.ansLink.split('||')[1]] = inp.value.trim();
    });
    [].slice.call(s.querySelectorAll('.choice input:checked')).forEach(function(inp){
      if (inp.value === 'Other'){
        var o = s.querySelector('[data-ans-other]');
        parts.push('Other' + (o && o.value.trim() ? ' (' + o.value.trim() + ')' : ''));
      } else parts.push(follows[inp.value] ? inp.value + ': ' + follows[inp.value] : inp.value);
    });
    out[key] = parts.length ? parts.join(' ; ') : '(skipped)';
  });
  return out;
}
function fieldKey(f){
  if (f.dataset.ansGrid) return 'G:' + f.dataset.ansGrid + '::' + f.value;
  if (f.dataset.ansExtra) return 'X:' + f.dataset.ansExtra;
  if (f.dataset.ans) return 'a:' + f.dataset.ans;
  if (f.dataset.ansLink) return 'l:' + f.dataset.ansLink;
  if (f.dataset.ansMulti) return 'm:' + f.dataset.ansMulti;
  if (f.dataset.ansOther) return 'o:' + f.dataset.ansOther;
  if (f.dataset.ansPrice) return 'P:' + f.dataset.ansPrice;
  if (f.dataset.ansHours) return 'H:' + f.dataset.ansHours;
  if (f.name) return 'c:' + f.name + '::' + f.value;
  return null;
}
function save(){
  try {
    var vals = {};
    [].slice.call(document.querySelectorAll('input[type=text],textarea,select')).forEach(function(f){
      var k = fieldKey(f); if (k && f.value) vals[k] = f.value;
    });
    [].slice.call(document.querySelectorAll('.choice input, .pill input')).forEach(function(f){
      var k = fieldKey(f); if (k && f.checked) vals[k] = 1;
    });
    localStorage.setItem(storeKey, JSON.stringify(vals));
  } catch(e){}
}
function restore(){
  try {
    var vals = JSON.parse(localStorage.getItem(storeKey) || '{}');
    [].slice.call(document.querySelectorAll('input[type=text],textarea,select')).forEach(function(f){
      var k = fieldKey(f); if (k && vals[k]) f.value = vals[k];
    });
    [].slice.call(document.querySelectorAll('select[data-ans-hours$="open"]')).forEach(function(so){
      var cs = so.closest('.hours-row').querySelector('select[data-ans-hours$="close"]');
      if (cs) cs.disabled = so.value === 'Closed';
    });
    [].slice.call(document.querySelectorAll('.choice input, .pill input')).forEach(function(f){
      var k = fieldKey(f);
      if (k && vals[k]){ f.checked = true; f.dispatchEvent(new Event('change', {bubbles:true})); }
    });
    var st = parseInt(localStorage.getItem(storeKey + '-step') || '0', 10);
    if (st > 0 && st < steps.length - 1) i = st;
  } catch(e){}
}

/* ================= SUBMIT ================= */
var submitArmed = false;
function submit(){
  var note = document.getElementById('sendnote');
  if (isTemplate){
    note.textContent = 'This is the studio template, so sending is turned off.';
    note.classList.add('show');
    return;
  }
  var payload = collect();
  var answered = Object.keys(payload).filter(function(k){ return k.charAt(0) === 'Q' && payload[k] !== '(skipped)'; }).length;
  if (answered < 7 && !submitArmed){
    submitArmed = true;
    note.textContent = 'You have answered ' + answered + ' of ' + total + ' products. If that is what you intended, please press Send Your Answers again.';
    note.classList.add('show');
    return;
  }
  next.disabled = true; next.textContent = 'Sending…';
  payload._subject = CONFIG.subject;
  payload._template = 'box';
  payload._captcha = 'false';
  var endpoint = 'https://formsubmit.co/ajax/' + CONFIG.emailUser + '@' + CONFIG.emailDomain;
  fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
    body: JSON.stringify(payload)
  }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(){
    document.querySelector('.step.active h2').textContent = 'Your answers have been sent. Thank you.';
    document.querySelector('.step.active .hint').textContent = 'Fahad has received your answers and will be in touch. Nothing is published without your approval.';
    next.style.display = 'none'; back.style.display = 'none';
    try { localStorage.removeItem(storeKey); localStorage.removeItem(storeKey + '-step'); } catch(e){}
  })
  .catch(function(){
    next.disabled = false; next.textContent = 'Send Your Answers';
    note.textContent = 'The send did not go through. Please check your internet connection and press Send Your Answers again.';
    note.classList.add('show');
  });
}

restore();
render();
</script>
</body>
</html>
